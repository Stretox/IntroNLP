[project]
name = "IntroNLP"
version = "0.1.0"
authors = [{ name = "Stretox", email = "stretoxcontact@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel>=7.4.0,<8",
    "pandas>=3.1.1,<4",
    "scikit-learn>=1.9.1,<2",
    "seaborn>=0.13.2,<0.14",
    "spacy>=3.8.16,<4",
    "torch"
]
